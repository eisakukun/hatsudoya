# Supabase の無料版は、1週間だれも使わないと止まる。毎朝6:17（日本時間）に一度のぞいて止めないようにする。
# GitHub は「60日だれも触っていないリポジトリ」の定期実行も止めるので、45日たったら空のコミットを1つ足して生かしておく。
name: keepalive
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Supabase をのぞく
        run: |
          URL=$(sed -n 's/^ *url: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/^ *key: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js が未設定なので、のぞかずに終わります"; exit 0; fi
          for i in 1 2 3; do
            if curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'; then echo; exit 0; fi
            sleep 20
          done
          echo "::error::Supabase に届きませんでした（止まっていたら supabase.com で Restore を押す）"; exit 1
      - name: リポジトリを生かしておく
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "hatsudoya-keepalive"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
