<body><a class="skip" href="#content">本文へ</a><header class="header"><a class="logo" href="./">初ドヤ<span>はじめてを、ほめあおう。</span></a><button id="about" class="badge">● 友だち向けテスト版</button></header><main id="content" tabindex="-1"><div id="app"><p>読み込んでいます…</p></div></main><div class="toast" id="toast" role="status" hidden></div><dialog id="modal"><div class="dialog-top"><h2 id="modal-title"></h2><button id="close-modal" aria-label="閉じる">×</button></div><div id="modal-content"></div></dialog><footer>初ドヤ · 友だち向けテスト版 · 無料・広告なし<br><span id="app-version"></span></footer>
<script>
// 直したコードをホーム画面のアプリにも届ける（version.txt と違えば読み直す）。直すたびに version.txt と一緒に上げる。
const APP_VERSION='2026-10-19-1';
document.getElementById('app-version').textContent='v'+APP_VERSION;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let checking=false;
async function checkVersion(){if(checking||!navigator.onLine)return;checking=true;try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(r.ok){const latest=(await r.text()).trim();if(latest&&latest!==APP_VERSION&&sessionStorage.getItem('reloaded_for')!==latest){sessionStorage.setItem('reloaded_for',latest);location.reload();}}}catch(e){}finally{checking=false;}}
checkVersion();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion();});
</script></body></html>
